# Definition for linker

MEMORY {
    ZP: start = $0000, size = $0100, type = rw, file = "";
    RAM: start = $0200, size = $0600, type = rw, file = "";
    PRG_ROM: start = $8000, size = $8000, type = ro, fill = no, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP, type = zp, optional = yes;
    BSS: load = RAM, type = bss, optional = yes;
    CODE: load = PRG_ROM, type = ro;
    RODATA: load = PRG_ROM, type = ro, optional = yes;
    VECTORS: load = PRG_ROM, type = ro, start = $FFFA, optional = yes;
}